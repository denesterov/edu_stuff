<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Минималистичный Гестбук</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>📖 Гостевая книга</h1>

    <h2>Сообщения посетителей:</h2>
    {% for post in posts %}
        <div class="post">
            <strong>{{ post[1] }}</strong> <!-- Имя -->
            <p style="margin: 5px 0;">{{ post[2] }}</p> <!-- Текст сообщения -->
            <div class="meta">Опубликовано: {{ post[3] }}</div> <!-- Местное время -->
        </div>
    {% else %}
        <p>Здесь пока нет ни одного сообщения. Будьте первым!</p>
    {% endfor %}

    <!-- Форма отправки сообщения -->
    <form method="POST" action="/">
        <label>Ваше имя:</label>
        <input type="text" name="name" required placeholder="Иван">
        
        <label>Сообщение:</label>
        <textarea name="message" rows="4" required placeholder="Привет, отличный сайт!"></textarea>
        
        <button type="submit">Оставить отзыв</button>
    </form>
</body>
</html>
